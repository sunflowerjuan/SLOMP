services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: predial_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predial_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Storage/Queue emulator (Blob 10000, Queue 10001, Table 10002).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  pdf:
    build:
      context: .
      dockerfile: apps/pdf-function/Dockerfile
    environment:
      PDF_SERVICE_KEY: ${PDF_SERVICE_KEY:-local-compose-only-change-me}
      # Empty: the service runs without the queue consumer and /render.
      # See .env.example to point it at the azurite container.
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      # Parallel LibreOffice slots for queue batches (default: CPUs - 1).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
    ports:
      - "3001:3001"
    depends_on:
      azurite:
        condition: service_started

  # One-shot: applies Prisma migrations, then exits. Seed is manual:
  #   docker compose run --rm migrate pnpm --filter shared db:seed
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: tooling
    command: pnpm --filter shared db:migrate:deploy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/predial_dev
      # This stack is local-only: lets the seed and the backend accept the
      # development defaults below. Never set it in a deployed environment.
      ALLOW_DEV_CREDENTIALS: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@paez-boyaca.gov.co}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/predial_dev
      ALLOW_DEV_CREDENTIALS: "true"
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 3000
      PDF_SERVICE_URL: http://pdf:3001
      PDF_SERVICE_KEY: ${PDF_SERVICE_KEY:-local-compose-only-change-me}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    volumes:
      # The official template is client material and isn't in git. The backend
      # no longer reads it: upload it through the API (apps/backend/README.md,
      # "Document templates").
      - ./apps/backend/templates:/app/templates:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      pdf:
        condition: service_started
      azurite:
        condition: service_started

volumes:
  db_data:
  azurite_data:
