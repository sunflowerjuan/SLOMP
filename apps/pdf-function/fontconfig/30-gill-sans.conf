<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Gill Sans MT is a commercial font that some municipal templates use in
     their header and footer. Without it LibreOffice falls back to DejaVu Sans,
     much wider, and the header text overflows its table cells. Gillius ADF is
     a free Gill Sans design with close widths. -->
<fontconfig>
  <alias binding="same">
    <family>Gill Sans MT</family>
    <prefer><family>Gillius ADF</family></prefer>
  </alias>
  <alias binding="same">
    <family>Gill Sans</family>
    <prefer><family>Gillius ADF</family></prefer>
  </alias>
</fontconfig>
