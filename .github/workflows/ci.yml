name: CI
on:
    pull_request:
        branches: [develop, main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://user:password@localhost:5432/ci_placeholder
            JWT_SECRET: ci-placeholder-secret
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter shared run db:generate
            - run: pnpm -r --if-present run lint
            - run: pnpm -r --if-present run build
            - run: pnpm -r --if-present --filter '!backend' run test
            # Fails the PR if any coverage metric drops below the thresholds
            # in apps/backend/vitest.config.ts.
            - run: pnpm --filter backend run test:cov
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: backend-coverage
                  path: apps/backend/coverage
                  if-no-files-found: ignore
