name: CI
on:
    pull_request:
        branches: [develop, main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://user:password@localhost:5432/ci_placeholder
            JWT_SECRET: ci-placeholder-secret
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter shared run db:generate
            - run: pnpm -r --if-present run lint
            - run: pnpm -r --if-present run build
            - run: pnpm -r --if-present run test

    # Not blocking yet: it becomes required after 3 green runs in a row of the
    # SL-166 flows suite (Julián flips continue-on-error then).
    e2e:
        runs-on: ubuntu-latest
        continue-on-error: true
        env:
            E2E_ADMIN_EMAIL: e2e-admin@example.test
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Throwaway password for this run only: nothing to store as a secret.
            - name: Generate the test administrator password
              run: echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
            - run: pnpm --filter e2e exec playwright install --with-deps chromium
            - name: Start database, Azurite, PDF service and backend
              env:
                  SEED_ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
                  SEED_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
              run: |
                  docker compose up -d --build db azurite pdf migrate backend
                  docker compose run --rm migrate pnpm --filter shared db:seed
                  curl --retry 30 --retry-connrefused --retry-delay 2 -s -o /dev/null http://localhost:3000/municipalities
            # Port 5173 is the CORS origin the backend allows by default.
            - name: Serve the frontend
              run: |
                  pnpm --filter frontend build
                  pnpm --filter frontend exec vite preview --port 5173 --strictPort &
                  curl --retry 30 --retry-connrefused --retry-delay 1 -s -o /dev/null http://localhost:5173
            - run: pnpm test:playwright
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: playwright-report
                  path: apps/e2e/playwright-report
                  if-no-files-found: ignore
            - name: Backend logs
              if: failure()
              run: docker compose logs backend
