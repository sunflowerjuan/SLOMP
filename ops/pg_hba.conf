# Production pg_hba (SL-133). Port 5432 is published for Power BI Service, so
# the image default (`host all all all`) must not apply: it would let the
# superuser in from the internet. Rules are read top to bottom.

local   all  all                                  trust
# Compose network (backend, migrate, backups): published-port traffic keeps
# the client's public address, so it never matches this range.
host    all  all  172.16.0.0/12                   scram-sha-256
host    all  all  127.0.0.1/32                    scram-sha-256
# The only way in from outside: read-only role, TLS mandatory, one database.
hostssl slomp bi_reader  0.0.0.0/0                scram-sha-256
hostssl slomp bi_reader  ::/0                     scram-sha-256
# Everything else, including postgres from outside and any non-TLS attempt.
host    all  all  all                             reject
